<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fido Uganda Loan Application</title>
</head>
<body>
  <form name="fido-uganda-loan-application" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="fido-uganda-loan-application" />
    <input type="text" name="full-name" />
    <input type="tel" name="phone-number" />
    <input type="text" name="national-id" />
    <input type="tel" name="mobile-money-number" />
    <input type="number" name="loan-amount" />
    <select name="repayment-period"><option value=""></option></select>
    <input type="number" name="monthly-net-income" />
    <select name="employment-status"><option value=""></option></select>
    <input type="checkbox" name="applicant-consent" value="confirmed" />
    <input name="bot-field" />
  </form>
</body>
</html>
